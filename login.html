<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – CAPACITY CONNECT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column justify-content-between min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <div class="brand-icon">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <span class="fs-5 fw-bold text-navy-primary">CAPACITY <span class="text-teal">CONNECT</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="card-modern p-4 p-sm-5 shadow-sm">
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-lock-fill"></i>
            </div>
            <h4 class="fw-bold text-navy-primary mb-1">Sign In to Account</h4>
            <p class="text-muted small">Enter your email and password to access your dashboard</p>
          </div>

          <div id="loginAlert" class="alert d-none small" role="alert"></div>

          <form id="loginForm" onsubmit="handleFormSubmit(event)">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="user@college.edu" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label small fw-semibold text-muted text-uppercase mb-0" style="font-size: 0.75rem;">Password</label>
                <a href="forgot-password.html" class="small text-decoration-none text-teal">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required>
                <button type="button" class="input-group-text bg-light border-start-0 text-muted" onclick="togglePasswordVisibility()">
                  <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">Remember my login</label>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-navy w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2">
              <span id="btnText">Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Don't have an account? <a href="register.html" class="fw-semibold text-teal text-decoration-none">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-white border-top text-center text-muted small mt-auto">
    <div class="container">&copy; CAPACITY CONNECT | Internet & Web Programming Lab Mini-Project</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleIcon.className = 'bi bi-eye-slash';
      } else {
        pwdInput.type = 'password';
        toggleIcon.className = 'bi bi-eye';
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.className = 'alert d-none small';
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('d-none');

      try {
        const { role } = await loginUser(email, password);
        alertBox.className = 'alert alert-success small d-block';
        alertBox.textContent = 'Login successful! Redirecting to dashboard...';

        setTimeout(() => {
          redirectToRoleDashboard(role);
        }, 1000);
      } catch (err) {
        alertBox.className = 'alert alert-danger small d-block';
        alertBox.textContent = err.message || 'Invalid credentials. Please try again.';
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
