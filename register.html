<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – CAPACITY CONNECT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column justify-content-between min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <div class="brand-icon">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <span class="fs-5 fw-bold text-navy-primary">CAPACITY <span class="text-teal">CONNECT</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <!-- Register Form Container -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card-modern p-4 p-sm-5 shadow-sm">
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4 class="fw-bold text-navy-primary mb-1">Create an Account</h4>
            <p class="text-muted small">Join CAPACITY CONNECT - Digital Capacity Building Portal</p>
          </div>

          <div id="registerAlert" class="alert d-none small" role="alert"></div>

          <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
            <!-- Role Selection Buttons -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Account Role</label>
              <div class="row g-2">
                <div class="col-6">
                  <input type="radio" class="btn-check" name="role" id="roleStudent" value="student" checked onchange="updateRoleDesc('student')">
                  <label class="btn btn-outline-secondary w-100 p-2.5 rounded-3 text-start d-flex align-items-center gap-2" for="roleStudent">
                    <i class="bi bi-mortarboard-fill text-teal"></i>
                    <div>
                      <div class="fw-bold small text-dark">Student / Trainee</div>
                      <div class="text-muted" style="font-size: 0.68rem;">Enroll in courses</div>
                    </div>
                  </label>
                </div>
                <div class="col-6">
                  <input type="radio" class="btn-check" name="role" id="roleTrainer" value="trainer" onchange="updateRoleDesc('trainer')">
                  <label class="btn btn-outline-secondary w-100 p-2.5 rounded-3 text-start d-flex align-items-center gap-2" for="roleTrainer">
                    <i class="bi bi-person-video3 text-teal"></i>
                    <div>
                      <div class="fw-bold small text-dark">Faculty / Trainer</div>
                      <div class="text-muted" style="font-size: 0.68rem;">Upload & manage</div>
                    </div>
                  </label>
                </div>
              </div>
            </div>

            <!-- Full Name -->
            <div class="mb-3">
              <label for="fullName" class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" id="fullName" class="form-control border-start-0 ps-0" placeholder="e.g. Ramesh Kumar" required>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="student@college.edu" required>
              </div>
            </div>

            <!-- Passwords -->
            <div class="row g-2 mb-4">
              <div class="col-sm-6">
                <label for="password" class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
              </div>
              <div class="col-sm-6">
                <label for="confirmPassword" class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.75rem;">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-navy w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2">
              <span id="btnText">Complete Registration</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Already have an account? <a href="login.html" class="fw-semibold text-teal text-decoration-none">Sign In here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-white border-top text-center text-muted small mt-auto">
    <div class="container">&copy; CAPACITY CONNECT | Internet & Web Programming Lab Mini-Project</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Check if role passed in query string (e.g. register.html?role=trainer)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'trainer') {
      document.getElementById('roleTrainer').checked = true;
    }

    function updateRoleDesc(role) {
      // Handles UI feedback if needed
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.querySelector('input[name="role"]:checked').value;

      const alertBox = document.getElementById('registerAlert');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.className = 'alert d-none small';

      if (password !== confirmPassword) {
        alertBox.className = 'alert alert-danger small d-block';
        alertBox.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Creating Account...';
      btnSpinner.classList.remove('d-none');

      try {
        const data = await registerUser(fullName, email, password, confirmPassword, role);
        alertBox.className = 'alert alert-success small d-block';
        alertBox.textContent = 'Registration successful! Redirecting...';

        setTimeout(() => {
          if (data && data.session) {
            redirectToRoleDashboard(role);
          } else {
            window.location.href = 'login.html';
          }
        }, 1200);
      } catch (err) {
        alertBox.className = 'alert alert-danger small d-block';
        alertBox.textContent = err.message || 'Registration failed. Please try again.';
        submitBtn.disabled = false;
        btnText.textContent = 'Complete Registration';
        btnSpinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
